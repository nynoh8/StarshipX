    <script>
      // If deployed on GitHub Pages with root folder selected, automatically redirect to compiled /docs/
      (function() {
        if (typeof window !== 'undefined' && window.location.hostname.includes('github.io') && !window.location.pathname.includes('/docs')) {
          var cleanPath = window.location.pathname.replace(/\/+$/, '');
          window.location.replace(cleanPath + '/docs/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
